# Publie l'appli web, les lieux du quotidien et les fréquences des transports sur GitHub Pages.
# - À chaque modification de l'appli sur main : publication rapide, avec les dernières données calculées.
# - Chaque lundi à 4 h (heure de Paris), et à la demande (onglet Actions > Publier CheckMap > Run workflow) :
#   nouveau calcul des lieux (OpenStreetMap, environ 20 min) et des horaires (transport.data.gouv.fr, plusieurs heures).
name: Publier CheckMap

on:
  push:
    branches: [main]
    paths: ['*.html', '*.webmanifest', 'sw.js', 'icon*', '.github/workflows/publier.yml']
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      lieux:
        description: 'Recalculer les lieux (commerces, santé, écoles…) depuis OpenStreetMap'
        type: boolean
        default: true
      horaires:
        description: 'Recalculer les horaires des transports'
        type: boolean
        default: true
      cherche:
        description: 'Horaires : réseaux à calculer, mots séparés par des virgules (vide : toute la France)'
        required: false
        default: ''
      extrait:
        description: 'Lieux : adresses d''extraits Geofabrik séparées par des virgules, pour un essai (vide : France et outre-mer)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CALC_LIEUX: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lieux) }}
      CALC_HORAIRES: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.horaires) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Données déjà calculées (reprise)
        run: |
          mkdir -p site /tmp/ancien
          dernier() { gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$1&per_page=20" --jq '[.artifacts[] | select(.expired | not)][0].id // empty'; }
          ID=$(dernier donnees)
          if [ -n "$ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > /tmp/ancien.zip && unzip -q /tmp/ancien.zip -d /tmp/ancien
            echo "Reprise de la sauvegarde $ID"
          else
            # Pas encore de sauvegarde : dernière publication du site, si elle existe encore.
            ID=$(dernier github-pages)
            if [ -n "$ID" ]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > /tmp/ancien.zip && unzip -q /tmp/ancien.zip -d /tmp/ancien
              tar -xf /tmp/ancien/artifact.tar -C /tmp/ancien && rm /tmp/ancien/artifact.tar
              echo "Reprise de la publication $ID"
            fi
          fi
          for d in lieux freq; do
            if [ -f "/tmp/ancien/$d/index.json" ]; then mv "/tmp/ancien/$d" "site/$d"; echo "  $d : repris"; else echo "  $d : aucune donnée"; fi
          done
          rm -rf /tmp/ancien /tmp/ancien.zip
      - name: Lieux (calcul)
        if: env.CALC_LIEUX == 'true'
        env:
          EXTRAIT: ${{ inputs.extrait }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          QUI=(); IFS=',' read -ra L <<< "$EXTRAIT"; for u in "${L[@]}"; do u=$(echo "$u" | xargs); [ -n "$u" ] && QUI+=(--extrait "$u"); done
          python outils/lieux/lieux_osm.py "${QUI[@]}" --sortie /tmp/lieux --cache /tmp/osm --efface
          rm -rf site/lieux && mv /tmp/lieux site/lieux
      - name: Fréquences des transports (calcul)
        if: env.CALC_HORAIRES == 'true'
        env:
          CHERCHE: ${{ inputs.cherche }}
        run: |
          if [ -n "$CHERCHE" ]; then QUI=(--cherche "$CHERCHE"); else QUI=(--tout); fi
          python outils/frequences/gtfs_frequences.py "${QUI[@]}" --sortie /tmp/freq --cache /tmp/gtfs --efface
          rm -rf site/freq && mv /tmp/freq site/freq
      - name: Données (sauvegarde pour les publications suivantes)
        if: env.CALC_LIEUX == 'true' || env.CALC_HORAIRES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: donnees
          path: |
            site/lieux
            site/freq
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Appli web
        run: cp *.html manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
